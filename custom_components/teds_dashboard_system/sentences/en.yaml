# Ted's Dashboard System — English Assist sentences.
#
# Installed into <config>/custom_sentences/en/teds_dashboard_system.yaml at setup
# (that's the only folder the default conversation agent auto-loads). Handlers
# are registered in intents.py.
language: en
intents:
  TedsAddAlarm:
    data:
      - sentences:
          - "(set|add|create|schedule) an alarm for {hour}[:{minute}] [{meridiem}][ {dayset}][ in [the] {area}]"
          - "(set|add|create|schedule) an alarm at {hour}[:{minute}] [{meridiem}][ {dayset}][ in [the] {area}]"
          - "(set|add|create|schedule) an alarm for {hour}[:{minute}] [{meridiem}][ {dayset}] named {name}"
          - "(set|add|create|schedule) (a|an) {scope} alarm (for|at) {hour}[:{minute}] [{meridiem}][ {dayset}]"
          - "wake me up at {hour}[:{minute}] [{meridiem}][ {dayset}][ in [the] {area}]"
  TedsListAlarms:
    data:
      - sentences:
          - "(list|show|read) [me] [my] alarms"
          - "what alarms do i have"
          - "what are my alarms"
          - "do i have any alarms [set]"
  TedsEnableAlarm:
    data:
      - sentences:
          - "(enable|turn on|activate) [the|my] {name} alarm"
          - "(enable|turn on|activate) the alarm for {hour}[:{minute}] [{meridiem}]"
  TedsDisableAlarm:
    data:
      - sentences:
          - "(disable|turn off|deactivate) [the|my] {name} alarm"
          - "(disable|turn off|deactivate) the alarm for {hour}[:{minute}] [{meridiem}]"
  TedsRemoveAlarm:
    data:
      - sentences:
          - "(delete|remove|cancel) [the|my] {name} alarm"
          - "(delete|remove|cancel) the alarm for {hour}[:{minute}] [{meridiem}]"
  TedsReadNotifications:
    data:
      - sentences:
          - "(read|list|show) [me] [my|the] notifications"
          - "what notifications do i have"
          - "what are my notifications"
          - "do i have any [new] notifications"
  TedsClearNotifications:
    data:
      - sentences:
          - "(clear|delete|dismiss) [all|my|the] notifications [{scope}]"
  TedsMarkNotificationsRead:
    data:
      - sentences:
          - "mark [my|the|all] notifications [as] read"
  TedsNavigate:
    data:
      - sentences:
          - "(show|open|display|view|take me to|go to|switch to|bring up) [the] [{area}] {view}"
          - "(show|display) me [the] [{area}] {view}"
          - "{area} {view}"
  TedsWeather:
    data:
      - sentences:
          - "(what's|what is|how's|hows) the weather [like] [today][ in {area}]"
          - "(what's|what is|how's|hows) the forecast [today][ in {area}]"
          - "is it (going to|gonna) rain [today][ in {area}]"
          - "is it (sunny|raining|snowing|cloudy) [right now][ in {area}]"
          - "(what's|what is) the (temp|temperature) outside [in {area}]"
          - "how (hot|cold|warm) is it outside [in {area}]"
  TedsPlayMusic:
    data:
      - sentences:
          - "(play|start|put on|resume) [some] music[ in [the] {area}]"
          - "(play|start|put on) {query}"
  TedsAnnounce:
    data:
      - sentences:
          - "announce {message}"
          - "(broadcast|make an announcement saying|make an announcement that) {message}"
          - "announce {scope} {message}"
  TedsNextAlarm:
    data:
      - sentences:
          - "when('s| is) my next alarm"
          - "what('s| is) my next alarm"
          - "when('s| is) the next alarm[ in [the] {area}]"
          - "what time is my next alarm"
          - "do i have an alarm coming up"
  TedsTimerStatus:
    data:
      - sentences:
          - "(what|which) timers (are|do i have) (set|running|active)"
          - "what timers are (set|running|active)[ in [the] {area}]"
          - "how (long|much time) (is|do i have) left on (my|the) timer"
          - "do i have any timers (running|set|active)"
          - "(list|show|check) [me] [my] timers"
  TedsNextCalendarEvent:
    data:
      - sentences:
          - "what('s| is) my next (appointment|event|meeting)"
          - "when('s| is) my next (appointment|event|meeting)"
          - "what('s| is) (next|coming up) on (my|the) calendar"
          - "what('s| is) on my (calendar|schedule|agenda) next"
          - "do i have (anything|any events|any appointments) coming up"
  TedsSetThermostat:
    data:
      - sentences:
          - "set [the] {zone} thermostat to {temperature} [degrees]"
          - "set [the] {zone} thermostat to {hvac_mode} [mode]"
          - "set [the] {zone} thermostat to [the] {preset} preset"
          - "set [the] thermostat to {temperature} [degrees][ in [the] {area}]"
          - "set [the] thermostat to {hvac_mode} [mode]"
          - "set [the] thermostat to [the] {preset} preset"
          - "set [the] temperature to {temperature} [degrees][ in [the] {area}]"
          - "(change|put) [the] temperature to {temperature} [degrees][ in [the] {area}]"
          - "make it {temperature} degrees[ in [the] {area}]"
  TedsAdjustThermostat:
    data:
      - sentences:
          - "(make it|turn it) {direction}[ in [the] {area}]"
          - "(make it|turn it) {direction} by {amount} degrees[ in [the] {area}]"
          - "(make|turn) [the] {zone} thermostat {direction}[ by {amount} degrees]"
          - "turn [the] {zone} thermostat {direction}[ by {amount} degrees]"
  TedsStartTimer:
    data:
      - sentences:
          - "(set|start|create|make) a timer for [{hours} (hour|hours)] [[and] {minutes} (minute|minutes)] [[and] {seconds} (second|seconds)]"
          - "(set|start|create|make) a [{hours} (hour|hours)] [{minutes} (minute|minutes)] [{seconds} (second|seconds)] timer"
          - "(set|start|create|make) a timer (called|named) {name} for [{hours} (hour|hours)] [[and] {minutes} (minute|minutes)] [[and] {seconds} (second|seconds)]"
  TedsCancelTimer:
    data:
      - sentences:
          - "(cancel|stop|delete|remove|end) [the|my] timer"
          - "(cancel|stop|delete|remove|end) [the|my] {name} timer"
          - "(cancel|stop|delete|remove|end) [the|my] [{start_hours} (hour|hours)] [{start_minutes} (minute|minutes)] [{start_seconds} (second|seconds)] timer"
  TedsPauseTimer:
    data:
      - sentences:
          - "pause [the|my] timer"
          - "pause [the|my] {name} timer"
          - "pause [the|my] [{start_hours} (hour|hours)] [{start_minutes} (minute|minutes)] [{start_seconds} (second|seconds)] timer"
  TedsResumeTimer:
    data:
      - sentences:
          - "(resume|unpause|continue) [the|my] timer"
          - "(resume|unpause|continue) [the|my] {name} timer"
          - "(resume|unpause|continue) [the|my] [{start_hours} (hour|hours)] [{start_minutes} (minute|minutes)] [{start_seconds} (second|seconds)] timer"
  TedsAddTime:
    data:
      - sentences:
          - "add {hours} (hour|hours) to [the|my] timer"
          - "add {minutes} (minute|minutes) to [the|my] timer"
          - "add {seconds} (second|seconds) to [the|my] timer"
  TedsRemoveTime:
    data:
      - sentences:
          - "(remove|subtract|take) {hours} (hour|hours) (from|off) [the|my] timer"
          - "(remove|subtract|take) {minutes} (minute|minutes) (from|off) [the|my] timer"
          - "(remove|subtract|take) {seconds} (second|seconds) (from|off) [the|my] timer"
lists:
  hour:
    range:
      type: number
      from: 0
      to: 23
  minute:
    range:
      type: number
      from: 0
      to: 59
  meridiem:
    values:
      - in: "(am|a m)"
        out: "am"
      - in: "(pm|p m)"
        out: "pm"
      - in: "in the morning"
        out: "am"
      - in: "in the (afternoon|evening)"
        out: "pm"
  dayset:
    values:
      - in: "(every day|everyday|daily)"
        out: "daily"
      - in: "[(on|during the|every) ]weekdays"
        out: "weekdays"
      - in: "[(on|during) ]the week"
        out: "weekdays"
      - in: "[(on|every) ]weekends"
        out: "weekends"
      - in: "[(on|every) ]the weekend"
        out: "weekends"
      - in: "[(on|every) ]monday[s]"
        out: "mon"
      - in: "[(on|every) ]tuesday[s]"
        out: "tue"
      - in: "[(on|every) ]wednesday[s]"
        out: "wed"
      - in: "[(on|every) ]thursday[s]"
        out: "thu"
      - in: "[(on|every) ]friday[s]"
        out: "fri"
      - in: "[(on|every) ]saturday[s]"
        out: "sat"
      - in: "[(on|every) ]sunday[s]"
        out: "sun"
  scope:
    values:
      - in: "(everywhere|in all rooms|all rooms|house wide|home wide)"
        out: "all"
      - in: "(whole home|whole house|unscoped)"
        out: "all"
      - in: "(to everyone|to everybody|to the whole house|to all rooms)"
        out: "all"
  view:
    values:
      - in: "(cameras|camera|cams|cam|security cameras|feeds|feed)"
        out: "cameras"
      - in: "(climate|thermostat|thermostats|temperature control|heating|cooling|hvac)"
        out: "climate"
      - in: "(weather|forecast)"
        out: "weather"
      - in: "(music|songs|media player|now playing)"
        out: "music"
      - in: "(calendar|calendars|schedule|agenda)"
        out: "calendar"
      - in: "(home|home screen|home page|main screen)"
        out: "home"
      - in: "(photos|photo|pictures|picture|photo album|gallery)"
        out: "photos"
      - in: "(settings|preferences|options|configuration|config)"
        out: "settings"
      - in: "(notifications|notification|alerts)"
        out: "notifications"
      - in: "(alarms|alarm)"
        out: "alarms"
      - in: "(timers|timer)"
        out: "timers"
  name:
    wildcard: true
  query:
    wildcard: true
  message:
    wildcard: true
  zone:
    wildcard: true
  temperature:
    range:
      type: number
      from: 1
      to: 99
  amount:
    range:
      type: number
      from: 1
      to: 20
  hvac_mode:
    values:
      - in: "(heat|heating)"
        out: "heat"
      - in: "(cool|cooling|ac|air conditioning)"
        out: "cool"
      - in: "(auto|automatic)"
        out: "auto"
      - in: "(heat cool|heat and cool|heat-cool|both)"
        out: "heat_cool"
      - in: "off"
        out: "off"
  preset:
    wildcard: true
  direction:
    values:
      - in: "(warmer|hotter)"
        out: "warmer"
      - in: "(cooler|colder)"
        out: "cooler"
  hours:
    range:
      type: number
      from: 0
      to: 99
  minutes:
    range:
      type: number
      from: 0
      to: 999
  seconds:
    range:
      type: number
      from: 0
      to: 999
  start_hours:
    range:
      type: number
      from: 0
      to: 99
  start_minutes:
    range:
      type: number
      from: 0
      to: 999
  start_seconds:
    range:
      type: number
      from: 0
      to: 999
