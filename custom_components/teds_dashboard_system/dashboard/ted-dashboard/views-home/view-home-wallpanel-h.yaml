# View: Home (Wall Panel — Landscape). path: home-wallpanel-h
# Two-column landscape home: LEFT column stacks a clock/weather header, an
# area-aware Room Card, and a compact Music player; RIGHT column is a full-height
# agenda Calendar. The Room Card is `dashboard_integration: true` with no
# sections, so it adopts THIS device's area and auto-populates — and hides itself
# (its slot collapses) when the device has no area. Navbar + background are the
# usual shared includes.
type: custom:grid-layout
path: home-wallpanel-h
title: Home (Wall Panel Landscape)
icon: mdi:home
layout:
  height: calc(100dvh - var(--ted-navbar-header-reserve, var(--kiosk-header-height, var(--header-height, 56px))) - var(--safe-area-inset-top, 0px) - var(--ted-navbar-bottom-reserve, 48px) - 24px)
  grid-template-columns: minmax(0, 0.85fr) minmax(0, 1fr)
  grid-template-rows: minmax(0, 1fr)
  grid-template-areas: |
    "left calendar"
  grid-gap: 12px
  padding: 12px
  box-sizing: border-box
  "--masonry-view-card-margin": "0px"
cards:
  - type: vertical-stack
    view_layout:
      grid-area: left
    card_mod:
      style: |
        :host { height: 100%; }
        #root {
          height: 100%;
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        #root > * { margin: 0 !important; }
        /* Clock stays at the top; the Room Card (2nd child) sits at its own natural
           (auto) height and is bottom-justified — its auto top-margin pushes it and
           the mini Music bar down so both sit together at the bottom. */
        #root > *:nth-child(2) { flex: 0 1 auto; min-height: 0; margin-top: auto !important; }
    cards:
      - type: custom:ted-clock-weather-card
        theme: ted-style
        transparency: 100
        dashboard_integration: true
        clock_size: custom
        clock_size_custom: 95
        weather_size: custom
        weather_size_custom: 95
        date_size: custom
        date_size_custom: 95
        hug_content: true
        card_mod:
          style: |
            .cwc { padding: 8px !important; }
      - type: custom:ted-room-card
        dashboard_integration: true
        header_name_size: 150
      - type: custom:ted-music-card
        dashboard_integration: true
        mode: mini
  - type: custom:ted-calendar-card
    view_layout:
      grid-area: calendar
    dashboard_integration: true
    default_view: agenda
    show_controls: false
    fill: true
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml