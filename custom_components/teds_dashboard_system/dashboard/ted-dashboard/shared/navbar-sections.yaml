# Shared Ted's Navbar sections - the SINGLE source of the bar's contents.
# FIVE FIXED positional sections, in order: Left, Mid-Left, Center, Mid-Right, Right.
# There is no `placement`/`align` — a section's position is fixed by its index.
# Referenced by navbar.yaml (normal) and navbar-autohide.yaml (auto-hide) via
# 'sections: !include navbar-sections.yaml'.
# 0 — Left Section
- items:
    - type: weather
      tap_action:
        action: navigate-dashboard
        dashboard: weather_dashboard
# 1 — Mid-Left Section (empty)
- items: []
# 2 — Center Section — auto-populated by the View Launcher.
# The launcher (Settings → Navbar → Launcher Buttons) prepends buttons for the
# dashboard's views into this section; leave it empty so there are no duplicates.
- items: []
# 3 — Mid-Right Section (empty)
- items: []
# 4 — Right Section
- items:
    - type: timers
    - type: alarms
    - type: datetime
      display: both-stacked
      date_format: MMMM D
      time_format: h:MM a
      tap_action:
        action: navigate-dashboard
        dashboard: calendar_dashboard
      hold_action:
        action: navigate-dashboard
        dashboard: alarms_dashboard
    - type: notifications
