# View: Music — Music Assistant player (custom:grid-layout). path: music
# The content area holds a self-contained ted-music-card driving this device's
# Settings → Sounds player: a now-playing player with Media/Queue/Recent/Lyrics tabs.
# The Media tab browses the Music Assistant library as artwork tiles. Navbar is a
# plain card (position:fixed).
# PREREQUISITE: Music Assistant (integration + a player). The Queue/Recent/Lyrics
# tabs also use the mass_queue custom integration.
type: custom:grid-layout
path: music
title: Music
icon: mdi:music
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-fullscreen-card
    view_layout:
      grid-area: content
    dashboard_integration: true
    state_key: music
    fill: true
    card:
      type: custom:ted-music-card
      dashboard_integration: true
      # Media tab presents the library as artwork tiles (Playlists / Albums / Artists /
      # Favorites) with a Recently-played row; switchable to a list from the card.
      media_layout: tiles
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml