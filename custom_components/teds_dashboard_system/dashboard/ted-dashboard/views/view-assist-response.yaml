# View: Assist-Response — the visual counterpart to a spoken Assist answer.
# A voice intent / automation calls `teds_dashboard_system.assist_response` (title +
# message + optional image, targeted at areas/devices); the backend pushes it here
# and navigates the targeted screens to this view. Content stays until replaced
# (no auto-revert yet). Navbar is a plain card (position:fixed).
type: custom:grid-layout
path: assist-response
title: Assist-Response
icon: mdi:message-text
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-fullscreen-card
    view_layout:
      grid-area: content
    dashboard_integration: true
    state_key: assist_response
    fill: true
    card:
      type: custom:ted-assist-response-card
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml
