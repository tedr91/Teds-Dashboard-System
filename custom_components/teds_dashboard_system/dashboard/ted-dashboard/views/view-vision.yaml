# View: Vision — Ted's Vision Card timeline of AI-analyzed camera events. path: vision
# Cameras are opted into Vision Analysis in Settings → Vision; detected events (severity,
# summary, thumbnail + clip) stream in here live. Navbar is a plain position:fixed card.
type: custom:grid-layout
path: vision
title: Vision
icon: mdi:cctv
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-fullscreen-card
    view_layout:
      grid-area: content
    dashboard_integration: true
    state_key: vision
    fill: true
    card:
      type: custom:ted-vision-card
      theme: ted-style
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml
