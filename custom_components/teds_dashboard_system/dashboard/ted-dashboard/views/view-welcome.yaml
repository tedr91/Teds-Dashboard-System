# View: Home-Welcome (native masonry) — path: home-welcome
# The dashboard's DEFAULT landing page (first view). It's an informational panel
# that guides setup (e.g. installing Ted's Dashboard System) and points to the
# right home view.
#
# IMPORTANT: this view intentionally uses HA's NATIVE (panel) layout rather than
# custom:grid-layout — Layout Card is one of the very dependencies it warns about,
# so the guidance must still render even when Layout Card isn't installed yet.
#
# `panel: true` renders ONLY the first card, full-width — so everything lives in a
# single vertical-stack, padded via card_mod (a panel view can't use grid-layout's
# own padding). The navbar + background includes are nested INSIDE that stack so
# they still render (both are fixed/invisible, so nesting is harmless).
panel: true
path: home-welcome
title: Home-Welcome
icon: mdi:home
cards:
  # Clock section — kept identical to the calendar-week view.
  # - !include ../shared/clock-header.yaml
  # Content section — dependency checks + home-view tip. Detection is done
  # server-side by Ted's Dashboard System (sensor.teds_requirements); each box is
  # gated by a state/attribute condition so it only appears when that dependency
  # is missing. MDI icons are used here so the boxes render even when the
  # custom-icons pack is the thing that's missing.
  - type: vertical-stack
    card_mod:
      style: |
        :host { height: 100%; }
        #root {
          height: 100%;
          overflow-y: auto;
          box-sizing: border-box;
          /* overflow-y:auto forces overflow-x:auto too; padding on all sides keeps card shadows from clipping */
          padding: 24px 24px var(--ted-navbar-bottom-reserve, 48px) 24px;
        }
    cards:
      # Always-on header + core fallback for the two blockers (layout-card /
      # Ted's Cards) — these can't be MessageBoxes because the view won't render
      # without them, so a core markdown card carries the warning.
      - type: markdown
        content: |
          ## Welcome to the TDS dashboard!

          {% set lc = state_attr('sensor.teds_requirements','layout_card') %}
          {% set tc = state_attr('sensor.teds_requirements','ted_cards') %}
          {% if lc == 'missing' %}
          🟥 **Layout Card isn't loaded** — install `layout-card` via HACS, or the views can't render.
          {% endif %}
          {% if tc == 'missing' %}
          🟥 **Ted's Cards (frontend) isn't loaded** — install Ted's Cards via HACS and refresh.
          {% endif %}
      # Device status at a glance — dependency/integration counts, this browser's
      # Browser Mod registration + id, backend connection/version, weather and the
      # media-player playback target. Client-side card (reads window.browser_mod);
      # only renders when Ted's Cards frontend is loaded, which the markdown
      # blocker above already covers when it isn't.
      - type: custom:ted-status-card
      # This browser isn't registered with Browser Mod yet — it has no name/area,
      # so per-device settings and area-scoped alerts can't target it. Offers a
      # one-tap register (falls back to the Browser Mod panel). Only shown once
      # Browser Mod is installed + set up.
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:cellphone-cog
        title: Register this device with Browser Mod
        message: >-
          This device isn't registered with Browser Mod yet, so it has no name or
          area. Register it to unlock per-device settings, area-scoped alarms and
          notifications, and the right home layout for this screen.
        dismiss_key: ted-register-device
        visible_when:
          - condition: device
            registered: false
          - condition: state
            entity: sensor.teds_requirements
            attribute: browser_mod
            state: ok
        actions:
          - { label: Register this device, icon: mdi:web, action: register-device, navigation_path: /browser-mod, variant: primary }
          - { label: Not now, action: dismiss-session }
      # Force an immediate requirements re-scan (the sensor otherwise refreshes on
      # HA start, a dashboard reload, or every ~10 min). Only shown once the backend
      # (which provides the service) is connected.
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:refresh
        title: Did you recently install or setup an integration?
        message: >-
          You can trigger a manual re-check now or simply wait until it naturally
          refreshes.
        actions:
          - { label: Re-check requirements, icon: mdi:refresh, action: perform-action, perform_action: teds_dashboard_system.check_requirements, variant: primary }
        visible_when:
          - condition: state
            entity: sensor.teds_settings
            state_not: [unknown, unavailable]
          - condition: state
            entity: sensor.teds_requirements
            attribute: all_met
            state: "false"
      # Frigate is installed and exposing cameras while this dashboard already has its
      # own camera list — offer a one-time switch to Frigate. (With no camera list yet,
      # the backend auto-adopts silently, so this box never appears in that case.)
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:cctv
        title: Use Frigate as your camera source?
        message: >-
          Frigate is installed and exposing cameras. Ted's Dashboard can switch to them
          as your camera source. This does a one-time clear of your current camera list
          and replaces it with your Frigate cameras.
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: frigate
            state: available
        actions:
          - { label: Use Frigate cameras, icon: mdi:cctv, action: perform-action, perform_action: teds_dashboard_system.adopt_frigate_cameras, variant: primary }
          - { label: No thanks, action: perform-action, perform_action: teds_dashboard_system.dismiss_frigate_prompt }
      # Backend integration — the funnel; shows only when it's absent (which is
      # also what unlocks every other check below).
      - type: custom:ted-messagebox-card
        severity: danger
        icon: mdi:alert-octagon
        title: Ted's Dashboard System not installed
        message: >-
          Install it to unlock alarms, timers, notifications, and per-device
          settings — and to power these dependency checks.
        docs_url: https://github.com/tedr91/Teds-Dashboard-System
        docs_label: Install guide
        visible_when:
          - condition: state
            entity: sensor.teds_settings
            state: [unknown, unavailable]
      # HACS — shown first among the reported checks (everything else installs through it).
      - type: custom:ted-messagebox-card
        severity: danger
        icon: mdi:storefront-outline
        title: HACS not detected
        message: HACS is how you install the plugins the dashboard needs.
        docs_url: https://hacs.xyz/
        docs_label: Get HACS
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: hacs
            state: missing
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:palette-outline
        title: Card-mod (or UIX) not installed
        message: Without card-mod or UIX, some card styling across the dashboard won't apply.
        docs_url: https://github.com/thomasloven/lovelace-card-mod
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: card_mod
            state: missing
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:palette-outline
        title: UIX is installed, but needs further setup
        message: >-
          UIX is downloaded in HACS but not set up yet. Add it under Settings →
          Devices & Services → Add Integration → UIX, then reload — card styling
          across the dashboard relies on it (or card-mod).
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: card_mod
            state: setup
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:emoticon-outline
        title: Custom Icons not installed
        message: Install Custom Icons via HACS so the dashboard's icons render (they may otherwise appear blank).
        docs_url: https://github.com/thomasloven/hass-custom_icons
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: custom_icons
            state: missing
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:emoticon-outline
        title: Custom Icons is installed, but needs further setup
        message: >-
          Custom Icons is downloaded in HACS but not set up yet. Go to Settings →
          Devices & Services → Add Integration → Custom Icons, then open it, click
          Configure, and Download the icon sets.
        docs_url: https://github.com/thomasloven/hass-custom_icons
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: custom_icons
            state: setup
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:calendar-alert
        title: Daylight Calendar Card not installed
        message: The Calendar views won't render without the Daylight Calendar Card.
        docs_url: https://github.com/superdingo101/daylight-calendar-card
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: daylight_calendar
            state: missing
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:web
        title: browser_mod not installed
        message: Install browser_mod via HACS — the Refresh button and some navigation rely on it.
        docs_url: https://github.com/thomasloven/hass-browser_mod
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: browser_mod
            state: missing
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:web
        title: Browser Mod is installed, but needs further setup
        message: >-
          browser_mod is downloaded in HACS but not set up yet. Add it under
          Settings → Devices & Services → Add Integration → Browser Mod.
        docs_url: https://github.com/thomasloven/hass-browser_mod
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: browser_mod
            state: setup
      - type: custom:ted-messagebox-card
        severity: warning
        icon: mdi:music
        title: Music Assistant integration not set up
        message: >-
          The Music view needs the Music Assistant integration — it's what exposes your
          Music Assistant players to Home Assistant. The MA app/server alone isn't enough.
          Add it under Settings → Devices & Services (it auto-discovers a running MA server).
        docs_url: https://www.home-assistant.io/integrations/music_assistant/
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: music_assistant
            state: missing
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:playlist-music
        title: mass_queue not installed
        message: >-
          Install the Music Assistant Queue (mass_queue) integration via HACS for richer
          Music card features — live queue, synced lyrics, and accurate player-provider
          ranking.
        docs_url: https://github.com/droans/mass_queue
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: mass_queue
            state: missing
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:playlist-music
        title: Music Assistant Queue is installed, but needs further setup
        message: >-
          mass_queue is downloaded in HACS but not set up yet. Add it under
          Settings → Devices & Services → Add Integration → Music Assistant Queue.
        docs_url: https://github.com/droans/mass_queue
        docs_label: Learn more
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: mass_queue
            state: setup
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:weather-partly-cloudy
        title: No weather entity found
        message: Add a weather integration so the clock/weather card can show a forecast.
        visible_when:
          - condition: state
            entity: sensor.teds_requirements
            attribute: weather
            state: missing
      # Per-device home-view suggestion (dismissible; each per device). Nightstand
      # uses the small-landscape bucket as an interim match — to be folded into a
      # smarter auto-detection later.
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:cellphone
        title: A better layout for this screen
        message: You appear to be on a phone — the Home (Handheld) view is a better fit.
        dismiss_key: ted-home-tip-handheld
        visible_when:
          - condition: screen
            media_query: "(orientation: portrait) and (max-width: 600px)"
          - condition: device
            registered: true
        actions:
          - { label: Use Home (Handheld), icon: mdi:cellphone, action: set-device-type, device_type: handheld, navigation_path: /ted-dashboard/home-handheld, variant: primary }
          - { label: Not now, action: dismiss-session }
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:monitor
        title: A better layout for this screen
        message: This looks like a large landscape display — the Home (Wall Panel Landscape) view is a better fit.
        dismiss_key: ted-home-tip-wallpanel-h
        visible_when:
          - condition: screen
            media_query: "(orientation: landscape) and (min-height: 601px)"
          - condition: device
            registered: true
        actions:
          - { label: Use Home (Wall Panel), icon: mdi:monitor, action: set-device-type, device_type: tablet-landscape, navigation_path: /ted-dashboard/home-wallpanel-h, variant: primary }
          - { label: Not now, action: dismiss-session }
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:tablet
        title: A better layout for this screen
        message: This looks like a large portrait tablet — the Home (Wall Panel Portrait) view is a better fit.
        dismiss_key: ted-home-tip-wallpanel-v
        visible_when:
          - condition: screen
            media_query: "(orientation: portrait) and (min-width: 601px)"
          - condition: device
            registered: true
        actions:
          - { label: Use Home (Wall Panel Portrait), icon: mdi:tablet, action: set-device-type, device_type: tablet-portrait, navigation_path: /ted-dashboard/home-wallpanel-v, variant: primary }
          - { label: Not now, action: dismiss-session }
      - type: custom:ted-messagebox-card
        severity: tip
        icon: mdi:bed-clock
        title: On a nightstand?
        message: Small bedside displays work well with the Home (Nightstand) view.
        dismiss_key: ted-home-tip-nightstand
        visible_when:
          - condition: screen
            media_query: "(orientation: landscape) and (max-height: 600px)"
          - condition: device
            registered: true
        actions:
          - { label: Use Home (Nightstand), icon: mdi:bed-clock, action: set-device-type, device_type: nightstand, navigation_path: /ted-dashboard/home-nightstand, variant: primary }
          - { label: Not now, action: dismiss-session }
      - !include ../shared/navbar.yaml
      - !include ../shared/background.yaml