# View: Weather (custom:grid-layout) — path: weather
# A single full-height Ted's Tab Card fills the content area with two tabs:
#   • Forecast — troinine/ha-weather-forecast-card (custom:weather-forecast-card), chart-mode
#     forecast for weather.forecast_home.
#   • Radar — timmaurice/lovelace-windy-card (custom:windy-card), animated Windy map loop.
# Both cards are referenced directly (assumed installed via HACS). Deep-link a tab with
# `?tab=forecast` / `?tab=radar`. Navbar is a plain card in `cards:`
# (`- !include ../shared/navbar.yaml`); it's position:fixed so it needs no grid-area.
type: custom:grid-layout
path: weather
title: Weather
icon: mdi:weather-partly-cloudy
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-fullscreen-card
    view_layout:
      grid-area: content
    dashboard_integration: true
    state_key: weather
    fill: true
    card:
      type: custom:ted-tab-card
      default_tab: 0
      url_param: tab
      tabs:
        - label: Forecast
          icon: mdi:weather-partly-cloudy
          slug: forecast
          requires:
            - element: weather-forecast-card
              name: Weather Forecast Card
              url: https://github.com/troinine/ha-weather-forecast-card
          card:
            type: custom:weather-forecast-card
            show_current: true
            show_forecast: true
            default_forecast: daily
            forecast_types: daily
            tap_action:
              action: more-info
            entity: weather.forecast_home
            show_condition_effects: true
            forecast:
              mode: chart
              show_sun_times: false
              use_color_thresholds: true
              scroll_to_selected: true
              default_chart_attribute: temperature_and_precipitation
              extra_attribute: precipitation_probability
              show_attribute_selector: false
            forecast_action:
              tap_action:
                action: toggle-forecast
              hold_action:
                action: select-forecast-attribute
            current:
              secondary_info_attribute: wind_speed
            grid_options:
              rows: auto
              columns: full
            card_mod:
              style: |
                /* Auto-scale fonts by BOTH viewport height (vh) and the card's own width
                   (container-query cqw, resolved against .wfc-container) so text stays
                   readable on large wall panels without ballooning on phones. Uses the
                   card's documented --ha-font-size-* hooks. Chart labels are computed at
                   :host and can't read container units, so they scale by viewport instead. */
                ha-card {
                  --weather-forecast-card-chart-font-size: clamp(12px, 0.9vh + 0.6vw, 24px);
                }
                .wfc-current-weather-container {
                  --ha-font-size-3xl: clamp(28px, 2.6vh + 1.8cqw, 60px);
                  --ha-font-size-xl: clamp(20px, 2vh + 1.2cqw, 44px);
                  --ha-font-size-m: clamp(14px, 1.2vh + 0.7cqw, 26px);
                }
                .wfc-forecast-container {
                  --ha-font-size-xl: clamp(18px, 1.5vh + 0.8cqw, 34px);
                  --ha-font-size-l: clamp(16px, 1.3vh + 0.7cqw, 30px);
                  --ha-font-size-m: clamp(14px, 1.2vh + 0.7cqw, 26px);
                  --ha-font-size-s: clamp(12px, 1vh + 0.6cqw, 22px);
                  --forecast-item-width: clamp(55px, 3vh + 3cqw, 110px);
                }
        - label: Radar
          icon: mdi:radar
          slug: radar
          requires:
            - element: windy-card
              name: Windy Card
              url: https://github.com/timmaurice/lovelace-windy-card
          card:
            type: custom:windy-card
            default_mode: map_only
            metric_temp: °F
            metric_rain: in
            metric_wind: mph
            zoom: 7
            overlay: satellite
            product: ecmwf
            level: surface
            aspect_ratio: ''
            no_padding: true
            overlay_loop:
              - rain
              - satellite
              - temp
            overlay_loop_delay: 10
            autoplay: true
            show_marker: false
            show_spot: false
            allow_geolocation: true
            hide_message: true
            hide_fullscreen_button: true
            card_mod:
              style: |
                /* aspect_ratio:'' makes the map a fixed 450px iframe, leaving blank space
                   in the full-height tab. Stretch the whole chain so the map fills it. */
                :host { height: 100%; }
                ha-card {
                  height: 100%;
                  display: flex;
                  flex-direction: column;
                }
                ha-card .card-content {
                  flex: 1 1 auto;
                  min-height: 0;
                  display: flex;
                  flex-direction: column;
                }
                ha-card .content {
                  flex: 1 1 auto;
                  min-height: 0;
                  display: flex;
                  flex-direction: column;
                }
                ha-card .iframe-container {
                  flex: 1 1 auto;
                  min-height: 0;
                  height: 100% !important;
                }
                ha-card iframe {
                  height: 100% !important;
                }
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml