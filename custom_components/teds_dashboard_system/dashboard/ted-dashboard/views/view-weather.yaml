# View: Weather (custom:grid-layout) — path: weather
# A single full-height Ted's Tab Card fills the content area with two tabs:
#   • Forecast — pkissling/clock-weather-card (custom:clock-weather-card), animated iOS-style
#     forecast for weather.forecast_home.
#   • Radar — jpettitt/weather-radar-card (custom:weather-radar-card), animated RainViewer loop.
# Both cards are referenced directly (assumed installed via HACS). Deep-link a tab with
# `?tab=forecast` / `?tab=radar`. Navbar is a plain card in `cards:`
# (`- !include ../shared/navbar.yaml`); it's position:fixed so it needs no grid-area.
type: custom:grid-layout
path: weather
title: Weather
icon: mdi:weather-partly-cloudy
layout: !include ../shared/layout-content.yaml
cards:
  - type: custom:ted-fullscreen-card
    view_layout:
      grid-area: content
    dashboard_integration: true
    state_key: weather
    fill: true
    card:
      type: custom:ted-tab-card
      default_tab: 0
      url_param: tab
      tabs:
        - label: Forecast
          icon: mdi:weather-partly-cloudy
          slug: forecast
          requires:
            - element: clock-weather-card
              name: Clock Weather Card
              url: https://github.com/pkissling/clock-weather-card
          card:
            type: custom:clock-weather-card
            entity: weather.forecast_home
            animated_icon: true
            forecast_rows: 7
            card_mod:
              style: |
                /* clock-weather-card sizes to its content (the "today" section scales with
                   card WIDTH), so forcing height:100% stretched it and, at full width, made
                   the today section huge with a big gap above the forecast. Instead center
                   the natural-height card and cap its width. */
                :host {
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                }
                ha-card {
                  width: 100%;
                  max-width: 700px;
                  background: color-mix(in srgb, var(--card-background-color, #fff) 88%, gray) !important;
                  -webkit-backdrop-filter: none !important;
                  backdrop-filter: none !important;
                }
        - label: Radar
          icon: mdi:radar
          slug: radar
          requires:
            - element: weather-radar-card
              name: Weather Radar Card
              url: https://github.com/jpettitt/weather-radar-card
          card:
            type: custom:weather-radar-card
            card_mod:
              style: |
                :host { height: 100%; }
  - !include ../shared/navbar.yaml
  - !include ../shared/background.yaml