add_alarm:
  name: Add alarm
  fields:
    label: { required: true, selector: { text: {} } }
    time: { required: true, selector: { time: {} } }
    days: { selector: { select: { multiple: true, options: ["0","1","2","3","4","5","6"] } } }
    description: { selector: { text: {} } }
    enabled: { selector: { boolean: {} } }
    location: { selector: { area: {} } }
update_alarm:
  name: Update alarm
  fields:
    id: { required: true, selector: { text: {} } }
remove_alarm:
  name: Remove alarm
  fields:
    id: { required: true, selector: { text: {} } }
start_timer:
  name: Start timer
  fields:
    name: { required: true, selector: { text: {} } }
    hours: { selector: { number: { min: 0, max: 23 } } }
    minutes: { selector: { number: { min: 0, max: 59 } } }
    seconds: { selector: { number: { min: 0, max: 59 } } }
    location: { selector: { area: {} } }
cancel_timer:
  name: Cancel timer
  fields:
    id: { required: true, selector: { text: {} } }
remove_recent:
  name: Remove recent timer
  fields:
    name: { required: true, selector: { text: {} } }
    hours: { selector: { number: { min: 0, max: 23 } } }
    minutes: { selector: { number: { min: 0, max: 59 } } }
    seconds: { selector: { number: { min: 0, max: 59 } } }
    location: { selector: { area: {} } }
pause_timer:
  name: Pause timer
  fields:
    id: { required: true, selector: { text: {} } }
resume_timer:
  name: Resume timer
  fields:
    id: { required: true, selector: { text: {} } }
update_timer:
  name: Update timer
  fields:
    id: { required: true, selector: { text: {} } }
    name: { selector: { text: {} } }
    hours: { selector: { number: { min: 0, max: 23 } } }
    minutes: { selector: { number: { min: 0, max: 59 } } }
    seconds: { selector: { number: { min: 0, max: 59 } } }
    location: { selector: { area: {} } }
notify:
  name: Show notification
  fields:
    title: { required: true, selector: { text: {} } }
    message: { required: true, selector: { text: {} } }
    severity: { selector: { select: { options: ["info", "success", "warning", "danger", "tip"] } } }
    icon: { selector: { icon: {} } }
    area: { selector: { area: {} } }
    timeout: { selector: { number: { min: 0, max: 600, unit_of_measurement: "s" } } }
    persistence: { selector: { select: { options: ["transient", "normal", "sticky"] } } }
    id: { selector: { text: {} } }
dismiss_notification:
  name: Dismiss notification
  fields:
    id: { required: true, selector: { text: {} } }
mark_read:
  name: Mark notification(s) read
  fields:
    id: { selector: { text: {} } }
    area: { selector: { area: {} } }
clear_notifications:
  name: Clear notifications
  fields:
    area: { selector: { area: {} } }
announce:
  name: Announce
  description: Speak a message on the targeted Ted's Dashboard devices/areas and show a prominent toast.
  fields:
    message: { required: true, selector: { text: {} } }
    title: { selector: { text: {} } }
    icon: { selector: { icon: {} } }
    areas: { selector: { area: { multiple: true } } }
    devices: { selector: { object: {} } }
    persistent: { selector: { boolean: {} } }
    timeout: { selector: { number: { min: 0, max: 600, unit_of_measurement: "s" } } }
    volume: { selector: { number: { min: 0, max: 100, unit_of_measurement: "%" } } }
    source_device: { selector: { text: {} } }
remove_announcement:
  name: Remove recent announcement
  fields:
    id: { required: true, selector: { text: {} } }
assist_response:
  name: Assist response
  description: Display a text answer (title + message + optional image) on the targeted Ted's Dashboard screens and switch them to the Assist-Response view.
  fields:
    message: { required: true, selector: { text: { multiline: true } } }
    title: { selector: { text: {} } }
    image: { selector: { text: {} } }
    areas: { selector: { area: { multiple: true } } }
    devices: { selector: { object: {} } }
    navigate: { selector: { boolean: {} } }
set_setting:
  name: Set setting
  fields:
    key: { required: true, selector: { text: {} } }
    value: { selector: { text: {} } }
    scope: { selector: { select: { options: ["global", "device"] } } }
    device_id: { selector: { text: {} } }
clear_setting:
  name: Clear setting
  fields:
    key: { selector: { text: {} } }
    scope: { selector: { select: { options: ["global", "device"] } } }
    device_id: { selector: { text: {} } }
register_device:
  name: Register device
  fields:
    device_id: { required: true, selector: { text: {} } }
    area: { selector: { area: {} } }
    name: { selector: { text: {} } }
    media_player: { selector: { entity: { domain: media_player } } }
    client_width: { selector: { number: { min: 0, mode: box } } }
    client_height: { selector: { number: { min: 0, mode: box } } }
    client_orientation: { selector: { text: {} } }
    client_form_factor: { selector: { text: {} } }

check_requirements:
  name: Check requirements
  description: Re-run server-side detection of optional dependencies (updates sensor.teds_requirements).

apply_climate:
  name: Apply climate request
  description: >-
    Run Ted's smart thermostat logic (used by the voice intents and the on-screen
    prompt buttons). Resolves setpoints for single or heat/cool range thermostats,
    can turn an off thermostat on, and honors the climate_min_delta setting.
  fields:
    entity_id: { selector: { entity: { domain: climate } } }
    zone: { selector: { text: {} } }
    area: { selector: { area: {} } }
    kind: { selector: { select: { options: ["absolute", "relative", "mode", "preset"] } } }
    temperature: { selector: { number: { min: 1, max: 99, step: 0.5, mode: box } } }
    amount: { selector: { number: { min: 1, max: 20, step: 0.5, mode: box } } }
    direction: { selector: { select: { options: ["warmer", "cooler"] } } }
    hvac_mode: { selector: { text: {} } }
    preset: { selector: { text: {} } }
    force_on: { selector: { boolean: {} } }

dashboard_customize_view:
  name: Customize dashboard view
  description: Fork a shipped Ted's Dashboard view into your overrides folder so you can edit it (it then stops receiving upstream updates).
  fields:
    view: { required: true, selector: { text: {} } }

dashboard_revert_view:
  name: Revert dashboard view
  description: Drop a forked view override and return to the shipped version.
  fields:
    view: { required: true, selector: { text: {} } }

dashboard_add_custom_view:
  name: Add custom dashboard view
  description: Scaffold a new user view in the Ted's Dashboard user overlay.
  fields:
    name: { required: true, selector: { text: {} } }
    title: { selector: { text: {} } }
    icon: { selector: { icon: {} } }

dashboard_remove_custom_view:
  name: Remove custom dashboard view
  description: Delete a user view from the Ted's Dashboard user overlay.
  fields:
    name: { required: true, selector: { text: {} } }

dashboard_set_layout:
  name: Set dashboard view layout
  description: Persist the user's view order and hidden list (view filenames) for Ted's Dashboard.
  fields:
    hidden: { selector: { object: {} } }
    order: { selector: { object: {} } }
